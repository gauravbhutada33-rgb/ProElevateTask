[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hr-agentic-solution"
version = "1.3.0"
description = "Enterprise HR Agentic Solution (MVP 1) - Multi-Agent ADK Supervisor with Zero-Trust Guardrails, Hybrid Policy RAG, Two-Phase HITL Gate, and Cross-Domain Saga Orchestration"
readme = "SDD.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk>=1.3.0",
    "google-cloud-aiplatform>=1.78.0",
    "google-cloud-dlp>=3.25.0",
    "google-cloud-kms>=2.24.0",
    "google-cloud-tasks>=2.16.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "mcp>=1.3.0",
    "aiolimiter>=1.2.1",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
    "PyJWT[crypto]>=2.10.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.8.2",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
