schema_version: "1.0"
project_name: "hr-agentic-solution"
version: "1.3.0"
agent:
  template: "adk"
  language: "python"
  directory: "app"
  entrypoint: "app.agent:root_agent"
  fast_api_entrypoint: "app.fast_api_app:app"
  guidance_file: "AGENTS.md"
deployment:
  target: "cloud_run"
  region: "us-central1"
  failover_region: "us-east1"
  session_type: "cloud_sql"
  cicd_runner: "github_actions"
evaluation:
  config_path: "tests/eval/eval_config.yaml"
  datasets_dir: "tests/eval/datasets"
  report_path: "tests/eval/evaluation_report.md"
