name: Spine CI & Architecture Guardrails Gate

on:
  push:
    branches: [main, "feat/pod*"]
  pull_request:
    branches: [main]

jobs:
  verify-spine-and-pod-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Gate 1 - Build-Time Exclusion of MockIdP & Relational SQLite in Production app/
        run: |
          uv run python -c "import pathlib; files = list(pathlib.Path('app').rglob('*.py')); assert all('mock_idp' not in p.read_text().lower() and 'sqlite3' not in p.read_text().lower() for p in files); print('Guardrail Check Passed: Zero MockIdP or relational SQLite imports in app/')"

      - name: Gate 2 - Run Unit & Spine Contract Suite
        run: uv run --extra dev pytest tests/unit/ -v

      - name: Gate 3 - Lint & Type Check
        run: |
          uv run --extra dev ruff check app/ tests/unit/
          uv run --extra dev mypy app/
