name: Spine CI & Architecture Guardrails Gate

on:
  push:
    branches: [main, "feat/pod*"]
  pull_request:
    branches: [main]

jobs:
  verify-spine-and-pod-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Gate 1 - Build-Time Exclusion of MockIdP & Relational SQLite in Production app/
        run: |
          python3 -c "
          import pathlib
          for path in pathlib.Path('app').rglob('*.py'):
              content = path.read_text()
              assert 'mock_idp' not in content.lower(), f'Forbidden MockIdP import in {path}'
              assert 'sqlite3' not in content.lower(), f'Forbidden relational sqlite3 import in {path}'
          print('Guardrail Check Passed: Zero MockIdP or relational SQLite imports in app/')
          "

      - name: Gate 2 - Run Unit & Spine Contract Suite
        run: uv run --extra dev pytest tests/unit/ -v

      - name: Gate 3 - Lint & Type Check
        run: |
          uv run --extra dev ruff check app/ tests/unit/
          uv run --extra dev mypy app/
